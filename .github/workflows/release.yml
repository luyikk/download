name: release

on:
  push:
    tags:
      - v[0-9]+.*
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: durl
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: durl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: durl
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: durl-gui
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: durl-gui
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: durl-gui
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: durl-gui-dx
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: durl-gui-dx
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: durl-gui-dx

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      # Install system deps for GUI builds on Linux
      - name: Install Linux system deps (GUI)
        if: runner.os == 'Linux' && (matrix.bin == 'durl-gui' || matrix.bin == 'durl-gui-dx')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ matrix.bin }}
          target: ${{ matrix.target }}
          features: ${{ matrix.features || '' }}
          archive: $bin-$target-${{ matrix.os }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}