[package]
name = "durl-gui"
version = "0.1.4"
edition = "2021"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
download-lib = { path = "../download-lib" }
tokio = { version = "1", features = ["full"] }
humansize = "2"
chrono = "0.4"
open = "5"
rfd = "0.17"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
dirs = "6"
ico = "0.5"
ntex = { version = "3", features = ["tokio"] }

[build-dependencies]
winres = "0.1"
ico = "0.5"

