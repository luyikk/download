[package]
name = "durl-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.30"
download-lib = { path = "../download-lib" }
tokio = { version = "1", features = ["full"] }
humansize = "2"
chrono = "0.4"
open = "5"
rfd = "0.15"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
dirs = "6"
ico = "0.3"

[build-dependencies]
winres = "0.1"
ico = "0.3"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
